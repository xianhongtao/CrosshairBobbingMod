pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
    }
}

plugins {
    // 本机只有 JDK 25，全部版本都用它编译；此处仅作 toolchain 兜底，正常不触发下载。
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven {
            name = 'Minecraft'
            url = 'https://libraries.minecraft.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
    }
}

rootProject.name = 'xbob-modern'

include 'modloader', 'main', 'fabric-mixin', 'game:api'
project(':game:api').projectDir = file('game/api')

def game = new File(settingsDir, 'game')

for (f in game.listFiles()) {
    if (f.isDirectory() && (f.name.startsWith('neoforge') || f.name.startsWith('fabric'))) {
        include "game:${f.name}"
    }
}
