java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    modbase {
        java.srcDirs = ['src/modbase/java']
        resources.srcDirs = ['src/modbase/resources']
    }
}

dependencies {
    implementation project(':game:api')
    implementation project(':modloader')

    modbaseImplementation 'net.fabricmc:fabric-loader:0.19.3'
}

// MainMod 源码与语言资源位于 modern 本地（不再引用仓库根的 legacy src）
sourceSets.main.java.srcDirs = ['src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources']

jar {
    from sourceSets.modbase.output

    manifest {
        attributes([
            'Implementation-Title'   : "${mod.name}",
            'Implementation-Vendor'  : "${mod.author}",
            'Implementation-Version' : "${mod.version}"
        ])
    }
}
